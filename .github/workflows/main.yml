name: Build and Auto-Commit Libs

on:
  workflow_dispatch: # Allows you to start it manually

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the action to push code
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare Release Folder
        run: |
          mkdir -p build_output/libs
          # Copy the compiled .so files
          cp -r app/src/main/jni/libs/* build_output/libs/ || true
          # Find and copy the generated DEX file
          find app/build -name "*.dex" -exec cp {} build_output/ \; || true

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatic Build: Added JNI Libs and DEX [skip ci]"
          file_pattern: 'build_output/*'
          branch: main # Change to your branch name if different
