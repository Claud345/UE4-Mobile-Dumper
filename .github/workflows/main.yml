name: Normal Android Studio Build

on:
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the files back to your repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b

      - name: Standard Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Organize Output
        run: |
          mkdir -p Android_Studio_Build
          # 1. Copy the APK (The main build result)
          cp app/build/outputs/apk/debug/app-debug.apk Android_Studio_Build/ || true
          
          # 2. Copy the final JNI Libs (What you need for the game)
          # This pulls from the final output folder Android Studio uses
          mkdir -p Android_Studio_Build/libs
          cp -r app/src/main/jni/libs/* Android_Studio_Build/libs/ || true

      - name: Push Build Results to Repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Normal Build Completed: APK and Libs included [skip ci]"
          file_pattern: 'Android_Studio_Build/*'
