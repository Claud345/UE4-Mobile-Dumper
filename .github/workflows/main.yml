name: Build JNI Libraries

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  build_jni:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b # Standard for modern ARM64 builds

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Project
        run: ./gradlew assembleDebug
        # This triggers the C++ compilation (ndk-build/cmake)

      - name: Upload JNI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JNI-Compiled-Libs-arm64
          # The double asterisks (**) tell GitHub to search every subfolder
          path: |
            **/build/intermediates/**/*.so
            **/src/main/jni/libs/arm64-v8a/*.so
          if-no-files-found: error
          
